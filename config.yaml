# PoML Simulation Configuration

model_path: "model/network.onnx"
ezkl_artifacts_dir: "model/"

num_miners: 4

# Total queries the generator will produce over the run (hard cap).
num_queries: 10000
# Phase 1: emit this many queries immediately at simulation start.
initial_burst: 10
# Phase 2: emit one further query every N seconds until num_queries is reached.
steady_interval_s: 20

# Per-miner mempool fetch strategy — cycled if shorter than num_miners. With
# Bitcoin-style peek mempool, multiple miners may legitimately work on the
# same queries; differing strategies model real-world heterogeneity.
#   sequential — FIFO (oldest first)
#   high_fee   — prioritize highest-fee queries
#   random     — uniformly shuffled each fetch
fetch_strategies: ["sequential", "high_fee", "random"]

# Difficulty target (hex) — lower = harder
# Per-attempt success probability ≈ difficulty / 2^256.
#   0x00ff... ≈ 1/256   (hard — may produce 0 blocks in a short run)
#   0x0fff... ≈ 1/16    (current: ~1-2 blocks expected per 10 min run)
#   0x3fff... ≈ 1/4     (easy — many blocks per run)
difficulty: "0x3fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"

block_reward: 50
network_latency_ms: 100
max_queries_per_block: 10

input_shape: [1, 2, 8, 8]
seed: 42

# Wall-clock deadline for the coordinator loop (seconds). The run will end
# earlier if all queries drain and at least one block has been confirmed.
simulation_timeout: 1800.0

# Cap total CPU cores used by the simulation (Linux only; null = use all).
# Applied via sched_setaffinity on the parent so miner subprocesses inherit
# the mask, plus RAYON_NUM_THREADS / OMP_NUM_THREADS set to cpu_limit //
# num_miners so each miner's ezkl proof doesn't oversubscribe the cap.
cpu_limit: 16

# Number of VRF-derived noise steps per inference (T in the paper).
# Our U-Net is single-pass, so only U_i[0] is fed to the model, but all T
# VRF outputs are produced, transcripted, and validated.
diffusion_steps: 1
