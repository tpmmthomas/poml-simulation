[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poml-sim"
version = "0.1.0"
description = "PoML blockchain consensus protocol simulation"
requires-python = ">=3.10"
dependencies = [
    "ezkl",
    "torch>=2.0",
    "onnx>=1.14",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "cryptography>=41.0",
    # Stable Diffusion appendix experiments
    # (experiments/exp3_sd_activation_divergence.py,
    #  experiments/exp4_sd_inference_timing.py)
    "diffusers",
    "transformers",
    "accelerate",
    "safetensors",
    "numpy",
    "matplotlib",
    "tqdm",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
